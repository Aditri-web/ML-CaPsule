name: Build README.md

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron:  '5 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Falls back to the always-available GITHUB_TOKEN if GH_TOKEN secret is not set
        token: ${{ secrets.GH_TOKEN || github.token }}
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - uses: actions/cache@v4
      name: Configure pip caching
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Install Python dependencies
      run: |
        python -m pip install -r requirements.txt
    - name: Update README.md
      env:
        # Falls back to GITHUB_TOKEN if GH_TOKEN is not configured as a repo secret
        GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
      run: |-
        python build_readme.py
        cat README.md
    - name: Commit and push (if changed)
      run: |-
        git diff
        git config --global user.name "readme-bot"
        git config --global user.email "actions@users.noreply.github.com"
        git add README.md
        git commit -m "This is an automated update of README.md." || exit 0
        git push
